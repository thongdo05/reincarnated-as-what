# Manual TestFlight upload. Does not run on push or pull request.
#
# Signing reuses one Apple Distribution certificate and one App Store profile
# from secrets. It does not pass -allowProvisioningUpdates and does not create
# a certificate. Apple allows one Apple Distribution certificate per team, and
# the App Manager API key cannot create one. Create the .p12 once with
# ios-signing-bootstrap.yml, which needs an Admin key. See docs/MOBILE_STORES.md.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      use_real_ads:
        description: "Use real AdMob unit ids. Off keeps Google's test ads (USE_TEST_ADS)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  IOS_SHORT_VERSION: "1.0"
  TEAM_ID: "9589T6378Y"
  BUNDLE_ID: "com.thongdo.reincarnatedaswhat"
  ASC_APP_APPLE_ID: "6831784046"

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set store version and ad units
        env:
          USE_REAL_ADS: ${{ inputs.use_real_ads }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          args=(--build-number "$BUILD_NUMBER" --short-version "$IOS_SHORT_VERSION")
          if [ "$USE_REAL_ADS" = "true" ]; then
            args+=(--use-real-ads)
          fi
          python3 tools/prepare_ios_export.py "${args[@]}"

      - name: Require Xcode 26
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1 { print $2 }' | cut -d. -f1)"
          if [ "$major" -lt 26 ]; then
            echo "App Store Connect requires an iOS binary built with Xcode 26 or later."
            exit 1
          fi

      - name: Check iOS plugin binaries
        run: python3 tools/check_ios_plugin_binaries.py --download-missing-admob

      - name: Install Godot
        run: |
          set -euo pipefail
          ver="$GODOT_VERSION"
          base="Godot_v${ver}-stable_macos.universal"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${ver}-stable/${base}.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          app=""
          for candidate in "$RUNNER_TEMP/godot"/*.app "$RUNNER_TEMP/godot"/*/*.app; do
            if [ -d "$candidate" ]; then
              app="$candidate"
              break
            fi
          done
          test -n "$app"
          xattr -dr com.apple.quarantine "$app" || true
          bin="$app/Contents/MacOS/Godot"
          test -x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${ver}-stable/Godot_v${ver}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          tdir="${HOME}/Library/Application Support/Godot/export_templates/${ver}.stable"
          mkdir -p "$tdir"
          mv "$RUNNER_TEMP/templates/templates/"* "$tdir/"
          test -f "$tdir/ios.zip"
          "$bin" --version

      - name: Archive and upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/ios_archive_and_upload.sh

      - name: Delete signing files
        if: always()
        run: bash tools/ios_cleanup_signing.sh
